[project]
name = "ssky"
version = "1.1.0"
description = "Simple bluesky client"
authors = [
    {name = "SimpleSkyClient Project", email = "simpleskypclient@gmail.com"}
]
readme = "README.md"
license = "MIT"
keywords = ["bluesky", "client"]
requires-python = ">=3.12,<3.15"
dependencies = [
    "beautifulsoup4 (>=4.12.3,<5.0.0)",
    "requests (>=2.32.3,<3.0.0)",
    "atproto (>=0.0.68,<0.0.69)",
]

[project.optional-dependencies]
mcp = ["fastmcp (>=2.14.0,<3.0.0)"]

[project.urls]
homepage = "https://github.com/simpleskyclient/ssky"
repository = "https://github.com/simpleskyclient/ssky"

[project.scripts]
ssky = "ssky.main:main"
ssky-mcp-server = "ssky_mcp.server:main"

[tool.poetry]
packages = [
    {include = "ssky", from = "src"},
    {include = "ssky_mcp", from = "src"}
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
python-dotenv = "^1.0.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_api: hits the live Bluesky API",
    "write_api: creates or deletes records on the live account; always also real_api",
]
# Real API tests are opt-in. A bare `pytest` must not touch the network or the
# live account, even when credentials are present.
#   -m real_api                      reads and writes
#   -m 'real_api and not write_api'  reads only
#   -m write_api                     writes only
# Selecting a write test is not by itself enough to run it: the require_test_account
# fixture still refuses to mutate an account other than the declared test one.
# See CONTRIBUTING.md.
addopts = "-m 'not real_api'"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
